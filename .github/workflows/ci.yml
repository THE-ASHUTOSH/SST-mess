name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          # CI-only stubs. These do not connect anywhere; they only satisfy
          # module-load env reads (e.g. lib/db.ts) so `next build` can finish.
          # Real values come from Vercel project env, never from CI.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuY2ktc3R1Yi5leGFtcGxlJA
          CLERK_SECRET_KEY: sk_test_ci_stub_not_a_real_key
          JWT_SECRET_KEY: ci_stub_jwt_secret_value_for_build_only
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
        run: pnpm build
